name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[http,dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src/meridian_node
      - name: Test
        run: pytest -q
