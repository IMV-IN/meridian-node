name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.1.1 or dev)"
        required: true
        default: "dev"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RAW="${INPUT_TAG}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          OWNER_LC="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"

          # A v* tag must match pyproject.toml. Free-form dispatch tags (e.g. "dev") are not checked.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [[ "${RAW}" == v* ]]; then
            PY_VER="$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read(), re.M).group(1))")"
            if [ "${VERSION}" != "${PY_VER}" ]; then
              echo "::error::Tag v${VERSION} does not match pyproject.toml version ${PY_VER}. Bump the version (or retag) and try again."
              exit 1
            fi
            echo "Tag/version ok: ${PY_VER}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # GHCR always publishes (built-in GITHUB_TOKEN). Docker Hub only when
          # the secret is configured, so forks / unconfigured repos don't fail.
          TAGS="ghcr.io/${OWNER_LC}/meridian-node:${VERSION}
          ghcr.io/${OWNER_LC}/meridian-node:latest"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            TAGS="${DOCKERHUB_USERNAME}/meridian-node:${VERSION}
          ${DOCKERHUB_USERNAME}/meridian-node:latest
          ${TAGS}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION} (ghcr owner: ${OWNER_LC})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ steps.meta.outputs.dockerhub == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Wheel + sdist as a workflow artifact only: no GitHub Release, no PyPI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: meridian-node-dist
          path: dist/*
          if-no-files-found: error
